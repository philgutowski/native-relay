# Relay manifest: a GitHub Projects board, local merge mode. The task process plans, builds
# and reviews on its own branch; the runner runs the gate, merges, and pushes.
#
# pr_terminal mode, where each task ends at an open pull request whose checks have decided, is
# named in the schema and refused by `relay validate`. The run loop has no PR sequence, so a run
# under it would halt on its first task. See docs/ideation/2026-08-25-relay-review-residuals.md.

[project]
repo = "~/code/example-service"
default_branch = "main"
mirror = []
# Optional. Task branches are this prefix plus the Task id. Default is "relay/" when the key is
# absent. Set it when the repo's convention is not relay/<id>.
# branch_prefix = "feat/"

[tracker]
adapter = "github"
owner = "example-org"
project_number = 7
# An issue is terminal when it is CLOSED, or when its item on the board reads this status.
status_field = "Done"
# KTD6 routes a task whose process printed no return envelope by asking whether the card reached
# this status. Required in local merge mode.
in_review_status = "In review"

[shipping]
mode = "local_merge"

[permissions]
allowed = ["Bash", "Read", "Edit", "Write", "Grep", "Glob", "Skill", "Agent", "TodoWrite"]
disallowed = []
# Optional. The paths a task's own commit may touch; unset means the whole repository.
task_allowed_paths = ["src/", "docs/"]

[timeouts]
task_minutes = 150
closeout_minutes = 20
# Unused in local merge mode, where the gate runs locally before the merge. Kept because the
# schema requires it.
ci_poll_minutes = 45

[closeout]
model = "sonnet"
effort = "medium"
allowed_tools = []
allowed_paths = []

[gate]
command = ["make", "check"]
description = "make check locally before the merge, and a pre push hook that runs it again"

[qualifying]
gate = "A pre push hook runs make check and refuses the push on failure; CI runs it again on main."
durable_state = "Merge commits on main and the board's issues are the only state carried between tasks."
independence = "The listed issues touch separate services and can ship in any order."
editors = "Only the repository's own maintainers can edit these issues or comment on them."

[on_blocked]
merge_partial = false
open_followup = true

[on_halt]
# Off, the first halt of any class stops the run. On, a halt contained to one task
# pauses that task and the later independent tasks keep running (issue #15).
continue_past_task_halt = false

# Every task here runs on claude, which is the one backend native mode runs today: the review
# step is Claude Code's built in `/code-review`, and `validate` refuses a task naming `codex` or
# `grok` until each has a verified equivalent. The `[defaults]` table is where a future default
# would go; a task that then differed from it would carry a `reason` string in the operator's
# own words, the same field an excluded task carries.
[defaults]
backend = "claude"

[[tasks]]
id = "412"
model = "opus"
effort = "high"

[[tasks]]
id = "413"
model = "sonnet"
effort = "medium"

[[tasks]]
id = "414"
model = "sonnet"
effort = "medium"
excluded = true
# Required on an excluded task. The sentence below is a fixture, not an operator's words.
reason = "example fixture: this card needs a design answer nobody can give unattended"
