# Grok member of docs/examples/pair/markdown.pair.toml. Mechanical, bounded tasks.
# Relay manifest: a project whose tracker is a markdown file in the repo itself. The smallest
# setup that works, and the one to try Relay with first.
#
# The tracker file's grammar:
#
#   - [ ] T-1 Add the parser          an open task
#     - 2026-08-25 blocked on X       a comment, indented under its task
#   - [x] T-2 Wire the loop (abc1234) a closed task and its landing reference
#
# The closeout process edits the line and commits it; the runner pushes that commit under the
# gate and then confirms the close by reading the file at the remote default branch. Under
# push = false nothing is pushed, and the file is read at the local default branch instead.

[project]
repo = "~/code/example-tool"
default_branch = "main"
mirror = []
# Optional. Task branches are this prefix plus the Task id. Default is "relay/" when the key is
# absent. Set it when the repo's convention is not relay/<id>.
# branch_prefix = "feat/"

[tracker]
adapter = "markdown"
file = "tasks.md"
done_statuses = ["closed"]
# Names the status the brief tells the task to write. The markdown line has no such state, so
# the no envelope rescue route (KTD6) never fires under this adapter; validate warns about it.
in_review_status = "in review"

[shipping]
mode = "local_merge"
# true pushes the merge, the closeout's commit, and any mirror. false merges each task locally
# and pushes nothing: the repo needs no origin, mirror must be empty, and the summary ends with
# the one git push that ships the default branch.
push = true

[permissions]
allowed = ["Bash", "Read", "Edit", "Write", "Grep", "Glob", "Skill", "TodoWrite"]
disallowed = []

[timeouts]
task_minutes = 90
closeout_minutes = 15
ci_poll_minutes = 30

[closeout]
model = "sonnet"
effort = "medium"
allowed_tools = []
allowed_paths = []
# Optional. Where the closeout may write a learning, as <docs_root>/solutions/. Default "docs".
# docs_root = "docs"

[gate]
command = ["python3", "-m", "unittest", "discover", "-s", "tests"]
description = "the unittest suite, run locally before the merge and again by the pre push hook"

[qualifying]
gate = "A pre push hook runs the unittest suite and refuses the push when it fails."
durable_state = "Merge commits on main and the lines in tasks.md are the only state carried between tasks."
independence = "Each listed task touches a separate module and none depends on another's outcome."
editors = "Only the operator's own account edits tasks.md, and it is reviewed on every push."

[on_blocked]
merge_partial = true
open_followup = false

[on_halt]
# Off, the first halt of any class stops the run. On, a halt contained to one task
# pauses that task and the later independent tasks keep running (issue #15).
continue_past_task_halt = false

[defaults]
backend = "grok"

[[tasks]]
id = "T-2"
model = "grok-4.6"
effort = "low"
backend = "grok"

[[tasks]]
id = "T-4"
model = "grok-4.6"
effort = "low"
backend = "grok"
